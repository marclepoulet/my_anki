<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anki">
<meta name="theme-color" content="#d9dfe3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Anki</title>
<style>
/* Index card (bristol) on a blue-grey desk blotter. */
:root {
  --bg: #d9dfe3; --surface: #ffffff; --text: #2a2d31; --muted: #5d6670; --line: #bfc8cf;
  --accent: #1f3a7a; --accent-fg: #ffffff; --accent-soft: #e3e8f1;
  --margin: #c8372d; --rule: #c9d6ea;
  --again: #c8372d; --hard: #a5670f; --good: #2d7a4b; --easy: #1f3a7a;
  --ok-soft: #e1efe6; --bad-soft: #f6e0dd;
  --serif: "New York", ui-serif, "Hiragino Mincho ProN", "Yu Mincho", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181c; --surface: #252a30; --text: #e6e8eb; --muted: #9aa3ad; --line: #353c45;
    --accent: #9db4e8; --accent-fg: #101318; --accent-soft: #263043;
    --margin: #e0675d; --rule: #2e353e;
    --again: #e0675d; --hard: #d9a24a; --good: #6cc08f; --easy: #9db4e8;
    --ok-soft: #1d3326; --bad-soft: #3a2120;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: var(--surface); color: var(--text); /* = tab bar colour, so any strip below the app blends in */
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px; line-height: 1.4;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  overscroll-behavior: none; -webkit-text-size-adjust: 100%;
}
input, textarea, select { user-select: text; -webkit-user-select: text; font: inherit; font-size: 16px; color: var(--text); }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
/* Pinned to the screen edges: in iOS home-screen mode, height:100% can stop short of the bottom and leave a gap. */
#app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }

.top {
  display: flex; align-items: center; gap: 8px; min-height: 44px;
  padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px) 8px calc(env(safe-area-inset-left) + 16px);
}
.top h1 { flex: 1; margin: 0; font-size: 28px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.top .link { font-size: 17px; }
main {
  flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding: 4px calc(env(safe-area-inset-right) + 16px) 24px calc(env(safe-area-inset-left) + 16px);
}
.tabs {
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding: 4px calc(env(safe-area-inset-right) + 4px) max(6px, env(safe-area-inset-bottom)) calc(env(safe-area-inset-left) + 4px);
}
.tabs button {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
  border: 0; background: none; padding: 6px 0; font-size: 11px; color: var(--muted);
}
.tabs button[aria-current="page"] { color: var(--accent); }
.tabs svg { width: 24px; height: 24px; }
.hidden { display: none !important; }

.panel { background: var(--surface); border-radius: 4px; padding: 16px; margin-bottom: 12px; }
.section-title { font-size: 15px; font-weight: 600; color: var(--muted); margin: 22px 0 4px; }
/* Lists read like a notebook: plain ruled rows on the desk, no boxes. */
.list { border-top: 1px solid var(--line); margin-bottom: 12px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 13px 2px; border: 0; background: none; border-bottom: 1px solid var(--line);
}
.row .grow { flex: 1; min-width: 0; }
.row .check { font-size: 22px; color: var(--accent); }
.row .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .sub { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chev { color: var(--muted); font-size: 20px; }
.pill { font-size: 13px; padding: 2px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 14px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 10px 16px; border-radius: 6px; border: 0;
  background: var(--accent-soft); color: var(--accent); font-weight: 600;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.danger { background: var(--bad-soft); color: var(--again); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.btn-row .btn { flex: 1 1 40%; }
.link { border: 0; background: none; color: var(--accent); padding: 8px 4px; min-height: 44px; }
.bold { font-weight: 700; }

.big { font-size: 56px; font-weight: 800; line-height: 1; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.grid .panel { margin: 0; }
.stat-num { font-size: 26px; font-weight: 700; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: 10px; }
.bar > div { height: 100%; background: var(--accent); border-radius: 999px; }
.chart { display: flex; align-items: flex-end; gap: 4px; height: 110px; margin-top: 10px; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; }
.chart .fill { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.chart .lbl { font-size: 10px; color: var(--muted); }
.chart .val { font-size: 10px; color: var(--muted); }

.search { width: 100%; padding: 11px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 12px; }

/* The index card: red margin line under the header, pale blue rules below.
   Cards still in the pile show as offset edges (box-shadow set in JS). */
.flash {
  position: relative; display: flex; flex-direction: column; justify-content: center; text-align: center;
  min-height: 300px; padding: 52px 20px 28px; margin-bottom: 44px; border-radius: 3px;
  background-color: var(--surface);
  background-image: linear-gradient(var(--margin), var(--margin)), repeating-linear-gradient(transparent 0 35px, var(--rule) 35px 36px);
  background-size: 100% 2px, 100% calc(100% - 46px);
  background-position: 0 42px, 0 46px;
  background-repeat: no-repeat;
  font-family: var(--serif);
}
.flash .q { font-size: 32px; line-height: 1.25; white-space: pre-wrap; word-break: break-word; }
.flash .a { font-size: 24px; line-height: 1.3; color: var(--accent); white-space: pre-wrap; word-break: break-word; }
.flash .notes { font-size: 17px; line-height: 1.5; color: var(--muted); white-space: pre-wrap; margin-top: 10px; }
.flash hr { border: 0; margin: 18px 0; }
.flash .crumb { position: absolute; top: 14px; left: 20px; right: 20px; text-align: left; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.flash img { display: block; max-width: 100%; max-height: 220px; margin: 12px auto 0; border-radius: 2px; }
.flash.swipe { touch-action: pan-y; }
.cloze { color: var(--accent); background: var(--accent-soft); border-radius: 3px; padding: 0 4px; font-weight: 600; }
.say { border: 0; background: none; color: var(--muted); min-width: 44px; min-height: 40px; margin: 2px auto 0; display: inline-flex; align-items: center; justify-content: center; }
.say svg { width: 22px; height: 22px; }
.center { text-align: center; }
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; margin-top: 10px; }
.heat i { aspect-ratio: 1; border-radius: 2px; background: var(--line); }
.heat .l1 { background: var(--accent); opacity: .3; } .heat .l2 { background: var(--accent); opacity: .5; }
.heat .l3 { background: var(--accent); opacity: .75; } .heat .l4 { background: var(--accent); }
.imgpick { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.imgpick img { max-height: 90px; max-width: 120px; border-radius: 4px; }
/* Visually hidden file input: its native button would otherwise overflow invisibly over "Retirer" and catch taps.
   The surrounding <label> still opens the picker. */
.imgpick input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); pointer-events: none; }
.flash.flip { animation: flip .32s ease-out; }
@keyframes flip { from { transform: perspective(900px) rotateX(70deg); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .flash.flip { animation: none; } }
.answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.answers button { border: 0; border-radius: 6px; padding: 10px 4px; min-height: 64px; color: #fff; font-weight: 700; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.answers small { font-weight: 500; opacity: .9; font-size: 12px; }
.r1 { background: var(--again); } .r2 { background: var(--hard); } .r3 { background: var(--good); } .r4 { background: var(--easy); }
@media (prefers-color-scheme: dark) { .answers button { color: #0b0b12; } }
.choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.choice { border: 2px solid var(--line); background: var(--surface); border-radius: 6px; padding: 14px 16px; text-align: left; min-height: 52px; white-space: pre-wrap; word-break: break-word; font-family: var(--serif); font-size: 18px; }
.choice.ok { border-color: var(--good); background: var(--ok-soft); }
.choice.bad { border-color: var(--again); background: var(--bad-soft); }

/* Sheets & toast */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; z-index: 10; }
.sheet {
  width: 100%; max-height: 88vh; overflow-y: auto; background: var(--bg); border-radius: 10px 10px 0 0;
  padding: 8px calc(env(safe-area-inset-right) + 16px) calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.field { display: block; margin-bottom: 12px; }
.field span { display: block; font-size: 13px; color: var(--muted); margin: 0 4px 4px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 11px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); resize: vertical;
}
.sheet .btn { margin-top: 8px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + 84px);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 20; max-width: 90%; text-align: center; font-size: 15px;
}
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }
</style>
</head>
<body>
<div id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
    <button data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>Cartes</button>
    <button data-tab="quiz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5v.01"/></svg>Quiz</button>
    <button data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Stats</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
  </nav>
</div>

<script>
'use strict';

/* ============================================================
   0. Utilities
   ============================================================ */
const DAY = 86400000;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// The study day starts at DAY_START o'clock (setting dayStartHour, default 4 h like Anki): 1 a.m. still counts as yesterday.
let DAY_START = 4;
const HOUR = 3600000;
const startOfDay = (t = Date.now()) => { const d = new Date(t - DAY_START * HOUR); d.setHours(0, 0, 0, 0); return d.getTime() + DAY_START * HOUR; };
const dayKey = (t) => { const d = new Date(t - DAY_START * HOUR); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); };
/* Cloze cards: "La capitale est {{Tokyo}}" shows a blank on the question side. */
const CLOZE = /\{\{(.+?)\}\}/g;
const hasCloze = (s) => /\{\{.+?\}\}/.test(s || '');
const clozeHTML = (s, reveal) => esc(s).replace(CLOZE, (_, w) => (reveal ? `<mark class="cloze">${w}</mark>` : '<span class="cloze">[…]</span>'));
const clozeText = (s, reveal) => String(s).replace(CLOZE, (_, w) => (reveal ? w : '…'));
const clozeAnswers = (s) => [...String(s).matchAll(CLOZE)].map((m) => m[1]).join(', ');
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = (s) => String(s ?? '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const plural = (n, one, many) => n + ' ' + (n > 1 ? many : one);
/* Inline style that draws up to 4 card edges under an index card, one per card left in the pile. */
function stack(n) {
  const s = ['0 1px 3px rgba(0,0,0,.18)'];
  for (let i = 1; i <= Math.min(n - 1, 4); i++) s.push(`0 ${i * 6}px 0 ${-i * 3}px var(--surface)`, `0 ${i * 6}px 0 ${1 - i * 3}px var(--line)`);
  return 'box-shadow:' + s.join(',');
}

// iOS ignores focus() outside a tap: the field becomes focused without a keyboard, and tapping it
// then does not open the keyboard either. So touch screens never get automatic focus.
const isTouch = window.matchMedia('(pointer: coarse)').matches;
/* Text-to-speech (works offline on iOS). Japanese text gets a Japanese voice, everything else French. */
const canSpeak = 'speechSynthesis' in window;
function speak(text) {
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = /[぀-ヿ㐀-鿿]/.test(text) ? 'ja-JP' : 'fr-FR';
  speechSynthesis.speak(u);
}
const sayBtn = (side) => canSpeak
  ? `<div><button class="say" data-a="say" data-side="${side}" aria-label="Lire à voix haute"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>`
  : '';
// Only data:image URLs are ever rendered (images come from backups, a trust boundary).
const isImage = (s) => typeof s === 'string' && /^data:image\/(jpeg|png|gif|webp);base64,/.test(s);
const imgHTML = (src) => (isImage(src) ? `<img src="${esc(src)}" alt="">` : '');
/* Downscales a picked photo to ≤ 800 px JPEG so cards and backups stay small. */
function readImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
      const cv = document.createElement('canvas');
      cv.width = Math.max(1, Math.round(img.naturalWidth * k));
      cv.height = Math.max(1, Math.round(img.naturalHeight * k));
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Image illisible')); };
    img.src = url;
  });
}
function updateBadge(n) {
  if (!('setAppBadge' in navigator)) return;
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}

function fmtInterval(days) {
  if (days < 30) return days + ' j';
  if (days < 365) return Math.round(days / 30) + ' mois';
  return (days / 365).toFixed(1).replace('.', ',') + ' an';
}
function dueLabel(card) {
  if (card.suspended) return 'Suspendue';
  if (!card.lastReview) return 'Nouvelle';
  const diff = card.dueDate - Date.now();
  if (diff <= 0) return 'À réviser';
  return 'Dans ' + fmtInterval(Math.max(1, Math.ceil(diff / DAY)));
}
let toastTimer = null;
function toast(msg) {
  document.querySelectorAll('.toast').forEach((t) => t.remove());
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2600);
}

/* ============================================================
   1. IndexedDB Initialization & Migration
   ============================================================ */
const DB_NAME = 'AnkiLocalDB';
const DB_VERSION = 1;
const DEFAULT_SETTINGS = { dailyGoal: 20, newPerDay: 20, lastBackup: 0, dayStartHour: 4, autoplay: false };
const LEECH = 8; // a card failed this many times is suspended so it can be rewritten
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB_NAME, DB_VERSION);
    r.onupgradeneeded = () => {
      const d = r.result;
      const make = (name, indexes, keyPath = 'id') => {
        if (d.objectStoreNames.contains(name)) return;
        const store = d.createObjectStore(name, keyPath === 'id' ? { keyPath: 'id', autoIncrement: true } : { keyPath });
        indexes.forEach((i) => store.createIndex(i, i, { unique: false }));
      };
      make('subjects', []);
      make('themes', ['subjectId']);
      make('cards', ['dueDate', 'themeId']);
      make('reviews', ['createdAt', 'cardId']);
      make('settings', [], 'key');
    };
    r.onsuccess = () => {
      db = r.result;
      db.onversionchange = () => { db.close(); location.reload(); };
      resolve(db);
    };
    r.onerror = () => reject(r.error);
    r.onblocked = () => reject(new Error('Base de données bloquée par une autre fenêtre.'));
  });
}

/* Runs `body(tx, out)` in one transaction; resolves with out.value once committed (oncomplete). */
function tx(stores, mode, body) {
  return new Promise((resolve, reject) => {
    let t;
    try { t = db.transaction(stores, mode); } catch (e) { reject(e); return; }
    const out = { value: undefined };
    t.oncomplete = () => resolve(out.value);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new Error('Transaction annulée'));
    try { body(t, out); } catch (e) { try { t.abort(); } catch (_) { /* already finished */ } reject(e); }
  });
}
function onReq(request, ok) {
  request.onsuccess = () => { if (ok) ok(request.result); };
  request.onerror = () => console.error('IndexedDB request failed', request.error);
  return request;
}

const getAll = (store, index, range) => tx(store, 'readonly', (t, out) => {
  const s = t.objectStore(store);
  onReq((index ? s.index(index) : s).getAll(range), (v) => { out.value = v; });
});
const getOne = (store, id) => tx(store, 'readonly', (t, out) => onReq(t.objectStore(store).get(id), (v) => { out.value = v; }));
const putOne = (store, obj) => tx(store, 'readwrite', (t, out) => onReq(t.objectStore(store).put(obj), (k) => { out.value = k; }));

async function getSettings() {
  const rows = await getAll('settings');
  const s = { ...DEFAULT_SETTINGS };
  rows.forEach((r) => { s[r.key] = r.value; });
  DAY_START = s.dayStartHour;
  return s;
}
const setSetting = (key, value) => { if (key === 'dayStartHour') DAY_START = value; return putOne('settings', { key, value }); };

/* Applies fn to each card in ids (fn returns the new card, or null to delete it), in one transaction. */
const updateCards = (ids, fn) => tx('cards', 'readwrite', (t) => {
  const store = t.objectStore('cards');
  ids.forEach((id) => onReq(store.get(id), (c) => {
    if (!c) return;
    const next = fn(c);
    onReq(next ? store.put(next) : store.delete(id));
  }));
});

async function loadLibrary() {
  const [subjects, themes, cards] = await Promise.all([getAll('subjects'), getAll('themes'), getAll('cards')]);
  subjects.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  themes.sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  const subjectById = new Map(subjects.map((s) => [s.id, s]));
  const themeById = new Map(themes.map((t) => [t.id, t]));
  return { subjects, themes, cards, subjectById, themeById };
}

function newCard(themeId, front, back, notes) {
  const now = Date.now();
  return { themeId, front, back, notes: notes || '', interval: 0, repetitions: 0, easeFactor: 2.5, dueDate: now, createdAt: now, lastReview: null, lapses: 0 };
}
function resetProgress(card) {
  return { ...card, interval: 0, repetitions: 0, easeFactor: 2.5, dueDate: Date.now(), lastReview: null, lapses: 0, weight: undefined };
}

/* ============================================================
   2. Review Queue Management
   ============================================================ */
function scopeFilter(scope, themes) {
  if (!scope) return () => true;
  if (scope.themeId) return (c) => c.themeId === scope.themeId;
  const subjOf = new Map(themes.map((t) => [t.id, t.subjectId]));
  return (c) => subjOf.get(c.themeId) === scope.subjectId;
}

/* Due learned cards first (oldest due first), then new cards up to the daily new-card limit. */
async function buildQueue(scope) {
  const [due, themes, settings, today] = await Promise.all([
    getAll('cards', 'dueDate', IDBKeyRange.upperBound(Date.now())),
    getAll('themes'),
    getSettings(),
    getAll('reviews', 'createdAt', IDBKeyRange.lowerBound(startOfDay())),
  ]);
  const cards = due.filter((c) => !c.suspended).filter(scopeFilter(scope, themes));
  const learned = cards.filter((c) => c.lastReview).sort((a, b) => a.dueDate - b.dueDate);
  const newToday = today.filter((r) => r.kind === 'review' && r.wasNew).length;
  const fresh = cards.filter((c) => !c.lastReview)
    .sort((a, b) => a.createdAt - b.createdAt)
    .slice(0, Math.max(0, settings.newPerDay - newToday));
  return { queue: learned.concat(fresh), learned: learned.length, fresh: fresh.length };
}

/* Free review: any card can come up, drawn at random in proportion to its weight.
   Each answer multiplies the weight (hard cards come up more, easy ones less). */
const WEIGHT_FACTOR = { 1: 2, 2: 1.5, 3: 0.8, 4: 0.5 };
const FREE_HINT = { 1: 'bien plus souvent', 2: 'plus souvent', 3: 'moins souvent', 4: 'rarement' };
// Cards without a weight yet start from their SM-2 history: more lapses or a lower ease = heavier.
const weightOf = (c) => c.weight ?? Math.round((1 + (c.lapses || 0) * 0.5) * (2.5 / (c.easeFactor || 2.5)) * 100) / 100;
const nextWeight = (c, q) => Math.min(10, Math.max(0.1, Math.round(weightOf(c) * WEIGHT_FACTOR[q] * 100) / 100));
function pickWeighted(cards, avoidId) {
  const pool = cards.length > 1 ? cards.filter((c) => c.id !== avoidId) : cards; // never the same card twice in a row
  let r = Math.random() * pool.reduce((s, c) => s + weightOf(c), 0);
  for (const c of pool) { r -= weightOf(c); if (r < 0) return c; }
  return pool[pool.length - 1] || null;
}

/* ============================================================
   3. SM-2 Logic
   ============================================================ */
const RATINGS = [
  { q: 1, label: 'À revoir' },
  { q: 2, label: 'Difficile' },
  { q: 3, label: 'Bon' },
  { q: 4, label: 'Facile' },
];
const EASY_BONUS = 1.3;
const HARD_FACTOR = 1.2;

function sm2(card, q) {
  // Buttons 1..4 map to SM-2 grades 2..5, so "Bon" keeps EF stable instead of lowering it by 0.14 each time.
  const g = q + 1;
  let ef = card.easeFactor + (0.1 - (5 - g) * (0.08 + (5 - g) * 0.02));
  if (ef < 1.3) ef = 1.3;
  let interval;
  let repetitions = card.repetitions;
  if (q === 1) {
    interval = 1;
    repetitions = 0;
  } else {
    if (repetitions === 0) interval = 1;
    else if (repetitions === 1) interval = 6;
    else interval = Math.round(card.interval * (q === 2 ? HARD_FACTOR : ef));
    if (q === 4) interval = Math.max(interval + 1, Math.round(interval * EASY_BONUS)); // Easy always beats Good
    interval = Math.max(1, interval);
    repetitions += 1;
  }
  // Due at the start of the study day, so a card answered at 21 h is ready the next morning, not at 21 h.
  return { interval, repetitions, easeFactor: Math.round(ef * 100) / 100, dueDate: startOfDay(Date.now() + interval * DAY) };
}

/* ---------- Generic sheet (form modal) ---------- */
/* html: trusted markup (already escaped by the caller). check(values): returns an error message or ''. */
function sheet({ title, fields = [], submitLabel = 'Enregistrer', extra = [], text = '', html = '', check = null }) {
  return new Promise((resolve) => {
    const wrap = document.createElement('div');
    wrap.className = 'backdrop';
    const images = {};
    let busy = false;
    const preview = (name) => (images[name] ? imgHTML(images[name]) : '<span class="muted small">Aucune image</span>');
    const fieldHTML = (f) => {
      if (f.type === 'image') {
        images[f.name] = isImage(f.value) ? f.value : '';
        return `<div class="field"><span>${esc(f.label)}</span><div class="imgpick" data-img="${f.name}">
          <span data-prev>${preview(f.name)}</span>
          <label class="btn">Choisir<input type="file" accept="image/*"></label>
          <button type="button" class="btn" data-rm="${f.name}">Retirer</button></div></div>`;
      }
      let input;
      if (f.type === 'textarea') input = `<textarea name="${f.name}" rows="${f.rows || 3}">${esc(f.value)}</textarea>`;
      else if (f.type === 'select') input = `<select name="${f.name}">${f.options.map((o) => `<option value="${esc(o.value)}"${String(o.value) === String(f.value) ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
      else input = `<input name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value)}" autocomplete="off"${f.type === 'number' ? ' inputmode="numeric" min="0"' : ''}>`;
      return `<label class="field"><span>${esc(f.label)}</span>${input}</label>`;
    };
    wrap.innerHTML = `<form class="sheet" novalidate>
      <div class="sheet-head"><button type="button" class="link" data-x>Annuler</button><strong>${esc(title)}</strong>${submitLabel ? `<button class="link bold" type="submit">${esc(submitLabel)}</button>` : '<span style="width:60px"></span>'}</div>
      ${text ? `<p class="muted small">${esc(text)}</p>` : ''}
      ${html}
      ${fields.map(fieldHTML).join('')}
      ${extra.map((x, i) => `<button type="button" class="btn block ${x.danger ? 'danger' : ''}" data-e="${i}">${esc(x.label)}</button>`).join('')}
    </form>`;
    const form = wrap.querySelector('form');
    const close = (v) => { wrap.remove(); resolve(v); };
    const showPreview = (name) => { form.querySelector(`[data-img="${name}"] [data-prev]`).innerHTML = preview(name); };
    form.addEventListener('change', async (e) => {
      const box = e.target.closest('[data-img]');
      if (!box || !e.target.files || !e.target.files[0]) return;
      busy = true;
      try { images[box.dataset.img] = await readImage(e.target.files[0]); showPreview(box.dataset.img); }
      catch (err) { toast(err.message); }
      finally { busy = false; e.target.value = ''; }
    });
    const collect = () => {
      if (busy) { toast('Image en cours de préparation…'); return null; }
      const fd = new FormData(form);
      const values = {};
      fields.forEach((f) => { values[f.name] = f.type === 'image' ? images[f.name] : String(fd.get(f.name) ?? '').trim(); });
      const missing = fields.find((f) => f.required && !values[f.name]);
      if (missing) { toast(`« ${missing.label} » est obligatoire.`); return null; }
      const err = check && check(values);
      if (err) { toast(err); return null; }
      return values;
    };
    wrap.addEventListener('click', (e) => {
      if (e.target === wrap || e.target.closest('[data-x]')) { close(null); return; }
      const rm = e.target.closest('[data-rm]');
      if (rm) { images[rm.dataset.rm] = ''; showPreview(rm.dataset.rm); return; }
      const b = e.target.closest('[data-e]');
      if (!b) return;
      const x = extra[+b.dataset.e];
      if (x.submit) { const values = collect(); if (values) close({ values, action: x.action }); }
      else close({ action: x.action });
    });
    form.onsubmit = (e) => { e.preventDefault(); if (!submitLabel) return; const values = collect(); if (values) close({ values, action: 'save' }); };
    document.body.appendChild(wrap);
    const first = form.querySelector('input, textarea');
    if (first && !isTouch) setTimeout(() => first.focus(), 60);
  });
}

/* Create (card = null, themeId given) or edit a card. Loops on "Enregistrer + suivante". */
async function editCard(card, themeId) {
  const history = card ? await getAll('reviews', 'cardId', card.id) : [];
  for (;;) {
    const lib = await loadLibrary();
    const themeOptions = lib.themes.map((t) => ({ value: t.id, label: (lib.subjectById.get(t.subjectId)?.name || '?') + ' › ' + t.name }));
    const r = await sheet({
      html: card ? cardHistoryHTML(card, history) : '',
      check: (v) => {
        if (!v.back && !hasCloze(v.front)) return '« Verso » est obligatoire (sauf pour un texte à trous {{…}}).';
        const dup = lib.cards.find((c) => c.id !== (card && card.id) && norm(c.front) === norm(v.front));
        if (dup && !(card && norm(card.front) === norm(v.front)) && !confirm(`Une carte avec ce recto existe déjà (${cardPath(dup, lib)}). L’enregistrer quand même ?`)) return 'Carte non enregistrée';
        return '';
      },
      title: card ? 'Modifier la carte' : 'Nouvelle carte',
      fields: [
        { name: 'front', label: 'Recto (question). Texte à trous : « La capitale est {{Tokyo}} »', type: 'textarea', value: card ? card.front : '', required: true },
        { name: 'back', label: 'Verso (réponse, facultatif pour un texte à trous)', type: 'textarea', value: card ? card.back : '' },
        { name: 'notes', label: 'Notes (facultatif)', type: 'textarea', rows: 2, value: card ? card.notes : '' },
        { name: 'image', label: 'Image affichée avec le recto (facultatif)', type: 'image', value: card ? card.image : '' },
        { name: 'themeId', label: 'Thème', type: 'select', value: card ? card.themeId : themeId, options: themeOptions },
      ],
      extra: card
        ? [
          { label: card.suspended ? 'Réactiver la carte' : 'Suspendre la carte', action: 'suspend' },
          { label: 'Réinitialiser la progression', action: 'reset' },
          { label: 'Supprimer la carte', action: 'delete', danger: true },
        ]
        : [{ label: 'Enregistrer + suivante', action: 'next', submit: true }],
    });
    if (!r) return;
    if (r.action === 'delete') {
      if (confirm('Supprimer cette carte ?')) { await deleteCard(card.id); toast('Carte supprimée'); }
      return;
    }
    if (r.action === 'reset') { await putOne('cards', resetProgress(card)); toast('Progression réinitialisée'); return; }
    if (r.action === 'suspend') {
      await putOne('cards', { ...card, suspended: !card.suspended });
      toast(card.suspended ? 'Carte réactivée' : 'Carte suspendue : elle ne sera plus proposée en révision');
      return;
    }
    const v = r.values;
    const tid = Number(v.themeId);
    if (card) await putOne('cards', { ...card, front: v.front, back: v.back, notes: v.notes, image: v.image, themeId: tid });
    else await putOne('cards', { ...newCard(tid, v.front, v.back, v.notes), image: v.image });
    toast('Carte enregistrée');
    if (r.action !== 'next') return;
    themeId = tid;
    await render();
  }
}

function streakOf(reviews) {
  const days = new Set(reviews.map((r) => dayKey(r.createdAt)));
  const d = new Date(); d.setHours(12, 0, 0, 0);
  if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (days.has(dayKey(d.getTime()))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------- Review session ----------
   Cards rated "À revoir" come back at the end of the session (relearn list, session only:
   their schedule was already set by SM-2). The last answer can be undone once. */
async function startReview(scope, label, free = false) {
  state.review = { scope, label, free, done: 0, revealed: false, current: null, relearning: false, remaining: 0, relearn: [], undo: null, force: null, pick: null, lastId: null };
  await render();
}
async function viewReview(guard) {
  const rv = state.review;
  const [{ queue }, lib, settings] = await Promise.all([rv.free ? { queue: [] } : buildQueue(rv.scope), loadLibrary(), getSettings()]);
  if (!guard()) return;
  const byId = new Map(lib.cards.map((c) => [c.id, c]));
  rv.relearn = rv.relearn.filter((id) => byId.has(id) && !byId.get(id).suspended);
  let c = null;
  let relearning = false;
  const usable = (id) => byId.has(id) && !byId.get(id).suspended;
  if (rv.force && usable(rv.force.id)) { c = byId.get(rv.force.id); relearning = rv.force.relearning; }
  else if (rv.free) {
    const pool = lib.cards.filter((x) => !x.suspended).filter(scopeFilter(rv.scope, lib.themes));
    c = usable(rv.pick) ? byId.get(rv.pick) : pickWeighted(pool, rv.lastId); // pick stays fixed until answered
    rv.pick = c ? c.id : null;
    rv.remaining = pool.length;
  }
  else if (queue.length) c = queue[0];
  else if (rv.relearn.length) { c = byId.get(rv.relearn[0]); relearning = true; }
  rv.current = c;
  rv.relearning = relearning;
  if (!rv.free) rv.remaining = queue.length + rv.relearn.length;
  setHeader(rv.label, { back: { label: 'Terminer', fn: endReview }, actions: c && !rv.free ? [{ label: String(rv.remaining), aria: 'Cartes restantes', fn: () => {} }] : [] });
  const undoLink = rv.undo ? '<button class="link small" data-a="undo">Annuler la dernière réponse</button>' : '';
  if (!c) {
    setMain(`<div class="panel empty"><div class="big">✓</div><p><strong>${rv.free ? 'Aucune carte à réviser ici' : 'Session terminée'}</strong></p><p>${plural(rv.done, 'réponse', 'réponses')}.</p>
      <button class="btn primary block" data-a="end">Retour</button><div style="margin-top:8px">${undoLink}</div></div>`, { end: endReview, undo: undoRating });
    return;
  }
  const theme = lib.themeById.get(c.themeId);
  const crumb = theme ? (lib.subjectById.get(theme.subjectId)?.name || '') + ' › ' + theme.name : '';
  // Direction is drawn once per showing (card id + answer count), so re-renders keep it stable.
  const key = c.id + ':' + rv.done;
  const firstShow = rv.dirKey !== key;
  if (firstShow) {
    const d = (theme && theme.direction) || 'front';
    rv.dirKey = key;
    rv.backward = d === 'back' || (d === 'mixed' && Math.random() < 0.5);
  }
  const speech = {}; // text read aloud by each speaker button ('q' question, 'a' answer)
  const face = (side, cls, k) => { speech[k] = c[side]; return `<div class="${cls}">${esc(c[side])}</div>${side === 'front' ? imgHTML(c.image) : ''}${sayBtn(k)}`; };
  let cardHTML;
  let answerPart = '';
  if (hasCloze(c.front)) { // cloze cards always ask the recto; revealing fills the blanks in place
    speech.q = clozeText(c.front, rv.revealed);
    cardHTML = `<div class="q">${clozeHTML(c.front, rv.revealed)}</div>${imgHTML(c.image)}${sayBtn('q')}`;
    if (c.back) answerPart = face('back', 'a', 'a');
  } else {
    cardHTML = face(rv.backward ? 'back' : 'front', 'q', 'q');
    answerPart = face(rv.backward ? 'front' : 'back', 'a', 'a');
  }
  if (c.notes) answerPart += `<div class="notes">${esc(c.notes)}</div>`;
  const answerHTML = rv.revealed && answerPart ? `<hr>${answerPart}` : '';
  const ratings = relearning
    ? [{ q: 1, label: 'À revoir', sub: 'encore' }, { q: 3, label: 'Bon', sub: fmtInterval(Math.max(1, Math.ceil((c.dueDate - Date.now()) / DAY))) }]
    : RATINGS.map((r) => ({ ...r, sub: rv.free ? FREE_HINT[r.q] : fmtInterval(sm2(c, r.q).interval) }));
  const controls = rv.revealed
    ? `<div class="answers"${relearning ? ' style="grid-template-columns:1fr 1fr"' : ''}>${ratings.map((r) => `<button class="r${r.q}" data-a="rate" data-q="${r.q}">${r.label}<small>${r.sub}</small></button>`).join('')}</div>
       <p class="muted small center" style="margin:8px 0 0">Glisse la fiche à gauche pour « À revoir », à droite pour « Bon ».</p>`
    : `<button class="btn primary block" data-a="reveal" style="min-height:64px">Afficher la réponse</button>`;
  const tag = relearning ? ', à revoir' : c.lastReview ? '' : ', nouvelle';
  const flip = rv.flip;
  rv.flip = false; // animate only on the render right after the tap
  const main = setMain(`<div class="flash${flip ? ' flip' : ''}${rv.revealed ? ' swipe' : ''}" style="${stack(rv.remaining)}" data-a="reveal"><div class="crumb">${esc(crumb)}${tag}</div>${cardHTML}${answerHTML}</div>${controls}
    <div class="center" style="margin-top:12px"><button class="link small" data-a="edit">Modifier la carte</button>${undoLink}</div>`, {
    reveal: () => { if (!rv.revealed) { rv.revealed = true; rv.flip = true; render(); } },
    rate: (d) => rateCard(+d.q),
    say: (d) => speak(speech[d.side]),
    undo: undoRating,
    edit: async () => { await editCard(c); render(); },
  });
  if (rv.revealed) attachSwipe(main.querySelector('.flash'), (dir) => rateCard(dir < 0 ? 1 : 3));
  // shortcut: iOS may ignore speech not started by a tap; it works once the user has tapped a speaker button.
  if (firstShow && settings.autoplay && canSpeak) speak(speech.q);
}
/* Horizontal swipe on an element: follows the finger, calls done(-1|1) past 90 px, else snaps back. */
function attachSwipe(el, done) {
  let x0 = null;
  let dx = 0;
  el.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    x0 = e.clientX; dx = 0; el.style.transition = 'none';
    try { el.setPointerCapture(e.pointerId); } catch (_) { /* synthetic pointer */ }
  });
  el.addEventListener('pointermove', (e) => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 25}deg)`;
  });
  const end = () => {
    if (x0 === null) return;
    x0 = null;
    if (Math.abs(dx) > 90) { done(Math.sign(dx)); return; }
    el.style.transition = 'transform .2s'; el.style.transform = '';
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}
async function rateCard(q) {
  const rv = state.review;
  const card = rv.current;
  if (!card || !rv.revealed) return;
  rv.current = null; // ignore double taps while writing
  const now = Date.now();
  const relearning = rv.relearning;
  const undo = { card, relearning, relearn: rv.relearn.slice(), reviewId: null };
  const free = rv.free;
  const weight = nextWeight(card, q);
  // A relearn answer is logged but does not reschedule: the card keeps the date SM-2 gave it.
  // A free answer only changes the card's weight, never its SM-2 schedule.
  const updated = relearning ? null
    : free ? { ...card, weight }
    : { ...card, ...sm2(card, q), weight, lastReview: now, lapses: (card.lapses || 0) + (q === 1 ? 1 : 0) };
  const leech = updated && !free && q === 1 && updated.lapses >= LEECH && !card.suspended;
  if (leech) updated.suspended = true;
  await tx(['cards', 'reviews'], 'readwrite', (t) => {
    if (updated) onReq(t.objectStore('cards').put(updated));
    onReq(t.objectStore('reviews').add({ cardId: card.id, kind: free ? 'free' : 'review', rating: q, correct: q > 1, wasNew: !free && !relearning && !card.lastReview, createdAt: now }), (id) => { undo.reviewId = id; });
  });
  rv.relearn = rv.relearn.filter((id) => id !== card.id);
  if (q === 1 && !free) rv.relearn.push(card.id);
  rv.undo = undo;
  rv.force = null;
  rv.pick = null;
  rv.lastId = card.id;
  if (leech) toast(`Carte ratée ${LEECH} fois : suspendue. Reformule-la dans Cartes puis réactive-la.`);
  rv.done++;
  rv.revealed = false;
  await render(); // queue is rebuilt from IndexedDB
}
async function undoRating() {
  const rv = state.review;
  const u = rv.undo;
  if (!u) return;
  rv.undo = null;
  await tx(['cards', 'reviews'], 'readwrite', (t) => {
    if (!u.relearning) onReq(t.objectStore('cards').put(u.card));
    if (u.reviewId != null) onReq(t.objectStore('reviews').delete(u.reviewId));
  });
  rv.relearn = u.relearn;
  rv.done--;
  rv.force = { id: u.card.id, relearning: u.relearning };
  rv.revealed = true;
  toast('Réponse annulée');
  await render();
}
function endReview() { state.review = null; render(); }

async function viewLibrary(guard) {
  const lib = await loadLibrary();
  if (!guard()) return;
  const L = state.lib;
  const subject = L.subjectId ? lib.subjectById.get(L.subjectId) : null;
  const theme = L.themeId ? lib.themeById.get(L.themeId) : null;
  if (L.subjectId && !subject) { L.subjectId = null; L.themeId = null; return render(); }
  if (L.themeId && !theme) { L.themeId = null; return render(); }
  if (theme) return libTheme(lib, subject, theme);
  if (subject) return libSubject(lib, subject);
  return libRoot(lib);
}

function cardRow(c, lib, withPath) {

}
const openCard = (lib) => async (d) => { await editCard(lib.cards.find((c) => c.id === +d.id)); render(); };

function libRoot(lib) {

    <input class="search" type="search" placeholder="Rechercher une carte" value="${esc(state.lib.search)}" id="search">

function libTheme(lib, subject, theme) {
  const cards = lib.cards.filter((c) => c.themeId === theme.id).sort((a, b) => a.createdAt - b.createdAt);
  const add = async () => { await editCard(null, theme.id); render(); };
  const sel = state.select && state.select.themeId === theme.id ? state.select.ids : null; // selection mode
  const leave = () => { state.select = null; state.lib.themeId = null; render(); };
  setHeader(theme.name, {
    back: { label: subject.name, fn: leave },
    actions: sel
      ? [{ label: 'OK', aria: 'Terminer la sélection', fn: () => { state.select = null; render(); } }]
      : [{ label: 'Choisir', aria: 'Sélectionner des cartes', fn: () => { state.select = { themeId: theme.id, ids: new Set() }; render(); } }, { label: '+', aria: 'Nouvelle carte', fn: add }],
  });
  const done = (msg) => { state.select = null; toast(msg); render(); };
  const ids = sel ? [...sel] : [];
  const need = () => { if (!ids.length) toast('Sélectionne d’abord des cartes'); return ids.length > 0; };
  const actions = sel
    ? `<div class="btn-row">
      <button class="btn" data-a="all">${sel.size === cards.length ? 'Aucune' : 'Toutes'}</button>
      <button class="btn" data-a="move">Déplacer</button>
      <button class="btn" data-a="suspend">Suspendre</button>
      <button class="btn" data-a="unsuspend">Réactiver</button>
      <button class="btn danger" data-a="remove">Supprimer</button>
    </div>
    <div class="section-title">${plural(sel.size, 'carte sélectionnée', 'cartes sélectionnées')}</div>`
    : `<div class="btn-row">
      <button class="btn primary" data-a="review">Réviser</button>
      <button class="btn" data-a="free">Révision libre</button>
      <button class="btn" data-a="quiz">Quiz</button>
      <button class="btn" data-a="rename">Modifier</button>
      <button class="btn danger" data-a="delete">Supprimer</button>
    </div>
    <div class="section-title">${plural(cards.length, 'carte', 'cartes')}, ${DIRECTIONS.find((d) => d.value === (theme.direction || 'front')).label.toLowerCase()}</div>`;
  const rows = cards.map((c) => (sel
    ? cardRow(c, lib, false).replace('data-a="card"', 'data-a="toggle"').replace('<div class="grow">', `<span class="check" aria-hidden="true">${sel.has(c.id) ? '☑' : '☐'}</span><div class="grow">`)
    : cardRow(c, lib, false))).join('');
  setMain(`${actions}
    ${cards.length ? `<div class="list">${rows}</div>`
      : `<div class="panel empty"><p>Aucune carte dans ce thème.</p><button class="btn primary" data-a="add">Ajouter une carte</button></div>`}`, {
    card: openCard(lib),
    toggle: (d) => { const id = +d.id; if (sel.has(id)) sel.delete(id); else sel.add(id); render(); },
    all: () => { if (sel.size === cards.length) sel.clear(); else cards.forEach((c) => sel.add(c.id)); render(); },
    move: async () => {
      if (!need()) return;
      const options = lib.themes.filter((t) => t.id !== theme.id).map((t) => ({ value: t.id, label: (lib.subjectById.get(t.subjectId)?.name || '?') + ' › ' + t.name }));
      if (!options.length) { toast('Crée d’abord un autre thème'); return; }
      const r = await sheet({ title: 'Déplacer', submitLabel: 'Déplacer', fields: [{ name: 'themeId', label: 'Vers le thème', type: 'select', value: options[0].value, options }] });
      if (!r) return;
      const tid = Number(r.values.themeId);
      await updateCards(ids, (c) => ({ ...c, themeId: tid }));
      done(plural(ids.length, 'carte déplacée', 'cartes déplacées'));
    },
    suspend: async () => { if (!need()) return; await updateCards(ids, (c) => ({ ...c, suspended: true })); done(plural(ids.length, 'carte suspendue', 'cartes suspendues')); },
    unsuspend: async () => { if (!need()) return; await updateCards(ids, (c) => ({ ...c, suspended: false })); done(plural(ids.length, 'carte réactivée', 'cartes réactivées')); },
    remove: async () => {
      if (!need() || !confirm(`Supprimer ${plural(ids.length, 'carte', 'cartes')} ?`)) return;
      await updateCards(ids, () => null);
      done(plural(ids.length, 'carte supprimée', 'cartes supprimées'));
    },
    add,
    review: () => startReview({ themeId: theme.id }, theme.name),
    free: () => startReview({ themeId: theme.id }, theme.name + ', libre', true),
    quiz: () => { state.quizScope = 't:' + theme.id; go('quiz'); },
    rename: async () => { if (await editTheme(subject.id, theme)) render(); },
    delete: async () => {
      if (!confirm(`Supprimer le thème « ${theme.name} » et ses ${cards.length} cartes ?`)) return;
      await deleteTheme(theme.id); state.lib.themeId = null; toast('Thème supprimé'); render();
    },
  });
}

function startQuiz(cfg, lib, onlyIds) {
  const subjOf = new Map(lib.themes.map((t) => [t.id, t.subjectId]));
  const [kind, idStr] = cfg.scope.split(':');
  const id = Number(idStr);
  let pool = lib.cards.filter((c) => !c.suspended).filter((c) => kind === 't' ? c.themeId === id : kind === 's' ? subjOf.get(c.themeId) === id : true);
  if (onlyIds) pool = pool.filter((c) => onlyIds.includes(c.id));
  // Cloze cards always ask the sentence with blanks; the answer is the hidden words.
  const ask = (c) => (hasCloze(c.front) ? clozeText(c.front, false) : cfg.dir === 'back' ? c.back : c.front);
  const answer = (c) => (hasCloze(c.front) ? clozeAnswers(c.front) : cfg.dir === 'back' ? c.front : c.back);
  const questions = [];
  for (const card of shuffle(pool.slice()).slice(0, cfg.count)) {
    const expected = answer(card);
    if (cfg.mode === 'type') { questions.push({ cardId: card.id, prompt: ask(card), expected, choices: null }); continue; }
    const seen = new Set([norm(expected)]);
    const distractors = [];
    const tiers = [
      lib.cards.filter((c) => c.themeId === card.themeId),
      lib.cards.filter((c) => subjOf.get(c.themeId) === subjOf.get(card.themeId)),
      lib.cards,
    ];
    for (const tier of tiers) {
      for (const c of shuffle(tier.slice())) {
        if (distractors.length >= 3) break;
        const a = answer(c);
        if (!seen.has(norm(a))) { seen.add(norm(a)); distractors.push(a); }
      }
    }
    if (!distractors.length) continue;
    questions.push({ cardId: card.id, prompt: ask(card), expected, choices: shuffle([expected, ...distractors]) });
  }
  if (!questions.length) { toast('Pas assez de réponses différentes pour un quiz.'); return; }
  state.quiz = { cfg, questions, i: 0, picked: null, answers: [], finished: false };
  render();
}

async function viewQuizSession(guard) {
  if (!guard()) return;
  const qz = state.quiz;
  const quit = () => { if (qz.finished || !qz.answers.length || confirm('Quitter le quiz ?')) { state.quiz = null; render(); } };
  if (qz.finished) {
    const good = qz.answers.filter((a) => a.correct).length;
    const wrong = qz.answers.filter((a) => !a.correct);
    setHeader('Résultat', { back: { label: 'Quiz', fn: quit } });
    setMain(`<div class="panel" style="text-align:center"><div class="big">${Math.round((good / qz.answers.length) * 100)} %</div>
        <p class="muted">${good} bonne${good > 1 ? 's' : ''} réponse${good > 1 ? 's' : ''} sur ${qz.answers.length}</p></div>
      ${wrong.length ? `<div class="section-title">À retravailler</div><div class="list">${wrong.map((a) => `<div class="row"><div class="grow"><div class="title">${esc(a.q.prompt)}</div><div class="sub">${esc(a.q.expected)}</div></div></div>`).join('')}</div>
        <button class="btn primary block" data-a="retry">Rejouer les erreurs</button>` : ''}
      <button class="btn block" style="margin-top:8px" data-a="done">Terminer</button>`, {
      retry: async () => startQuiz(qz.cfg, await loadLibrary(), wrong.map((a) => a.q.cardId)),
      done: quit,
    });
    return;
  }
  const q = qz.questions[qz.i];
  const picked = qz.picked;
  setHeader(`Question ${qz.i + 1}/${qz.questions.length}`, { back: { label: 'Quitter', fn: quit } });
  const last = qz.answers[qz.answers.length - 1];
  let body;
  if (q.choices) {
    body = `<div class="choices">${q.choices.map((c, i) => {
      let cls = '';
      if (picked !== null) { if (c === q.expected) cls = 'ok'; else if (i === picked) cls = 'bad'; }
      return `<button class="choice ${cls}" data-a="pick" data-i="${i}" ${picked !== null ? 'disabled' : ''}>${esc(c)}</button>`;
    }).join('')}</div>`;
  } else if (picked === null) {
    body = `<form id="qz-type" class="choices"><input class="search" id="qz-input" style="margin:0" placeholder="Ta réponse" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn primary block">Valider</button></form>`;
  } else {
    body = `<div class="choices"><div class="choice ${last.correct ? 'ok' : 'bad'}">${esc(last.typed || '(vide)')}</div>
      ${last.correct ? '' : `<div class="choice ok">${esc(q.expected)}</div><button class="link small" data-a="override">J’avais bon, compter juste</button>`}</div>`;
  }
  const record = async (correct, extra) => {
    const a = { q, correct, ...extra };
    qz.answers.push(a);
    a.review = { cardId: q.cardId, kind: 'quiz', rating: null, correct, wasNew: false, createdAt: Date.now() };
    a.review.id = await putOne('reviews', a.review);
    render();
  };
  const hidden = qz.cfg.listen && picked === null; // listening quiz: the text appears only once answered
  const main = setMain(`<div class="flash" style="min-height:160px">${hidden ? '<div class="notes">Écoute et réponds</div>' : `<div class="q">${esc(q.prompt)}</div>`}${sayBtn('prompt')}</div>
    ${body}
    ${picked !== null ? `<button class="btn primary block" data-a="next">${qz.i + 1 < qz.questions.length ? 'Suivant' : 'Voir le résultat'}</button>` : ''}`, {
    say: () => speak(q.prompt),
    pick: (d) => {
      if (qz.picked !== null) return;
      qz.picked = +d.i;
      record(q.choices[qz.picked] === q.expected);
    },
    override: async () => {
      if (!last.review || last.review.id == null) return;
      last.correct = true;
      await putOne('reviews', { ...last.review, correct: true });
      render();
    },
    next: () => {
      qz.picked = null;
      if (qz.i + 1 < qz.questions.length) qz.i++; else qz.finished = true;
      render();
    },
  });
  if (qz.cfg.listen && qz.spoken !== qz.i) { qz.spoken = qz.i; speak(q.prompt); }
  const form = main.querySelector('#qz-type');
  if (form) {
    form.onsubmit = (e) => {
      e.preventDefault();
      if (qz.picked !== null) return;
      const typed = main.querySelector('#qz-input').value.trim();
      qz.picked = 0;
      record(typedMatches(typed, q.expected), { typed });
    };
    if (!isTouch) main.querySelector('#qz-input').focus();
  }
}
/* Typed answer check: ignores case, accents, punctuation and spacing; "a, b / c" accepts any part. */
function typedMatches(typed, expected) {
  const loose = (s) => norm(s).replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  const t = loose(typed);
  if (!t) return false;
  return [expected, ...expected.split(/[,;/]/)].some((x) => loose(x) === t);
}

/* ---------- Statistics ---------- */
async function viewStats(guard) {
  const [lib, reviews, settings] = await Promise.all([loadLibrary(), getAll('reviews'), getSettings()]);
  if (!guard()) return;
  setHeader('Statistiques');
  const now = Date.now();
  const cards = lib.cards;
  const due = cards.filter((c) => c.dueDate <= now && !c.suspended).length;
  const suspended = cards.filter((c) => c.suspended).length;
  const fresh = cards.filter((c) => !c.lastReview).length;
  const mastered = cards.filter((c) => c.interval >= 21).length;
  const today = reviews.filter((r) => r.createdAt >= startOfDay());
  const week = reviews.filter((r) => r.createdAt >= startOfDay() - 6 * DAY);
  const rate = week.length ? Math.round((week.filter((r) => r.correct).length / week.length) * 100) + ' %' : '—';

  const days = [];
  // Study days (start at DAY_START); +26 h then startOfDay lands on the next day even across DST changes.
  const nextDay = (from) => startOfDay(from + DAY + 2 * HOUR);
  for (let i = 13; i >= 0; i--) {
    const from = startOfDay(Date.now() - i * DAY);
    const to = nextDay(from);
    days.push({ label: String(new Date(from).getDate()), n: reviews.filter((r) => r.createdAt >= from && r.createdAt < to).length });
  }
  const forecast = [];
  for (let i = 0; i < 7; i++) {
    const from = startOfDay(Date.now() + i * DAY);
    const to = nextDay(from);
    forecast.push({
      label: i === 0 ? 'auj.' : new Date(from).toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', ''),
      n: cards.filter((c) => c.lastReview && !c.suspended && (i === 0 ? c.dueDate < to : c.dueDate >= from && c.dueDate < to)).length,
    });
  }
  const chart = (data) => {
    const max = Math.max(1, ...data.map((x) => x.n));
    return `<div class="chart">${data.map((x) => `<div class="col"><span class="val">${x.n || ''}</span><div class="fill" style="height:${Math.round((x.n / max) * 80)}%"></div><span class="lbl">${esc(x.label)}</span></div>`).join('')}</div>`;
  };
  // Activity calendar: 17 weeks, one column per week (Monday on top), ending with the current week.
  const perDay = new Map();
  reviews.forEach((r) => { const k = dayKey(r.createdAt); perDay.set(k, (perDay.get(k) || 0) + 1); });
  const today0 = new Date(); today0.setHours(12, 0, 0, 0);
  const d0 = new Date(today0); d0.setDate(d0.getDate() - ((today0.getDay() + 6) % 7) - 16 * 7);
  const heat = [];
  for (const d = d0; d <= today0; d.setDate(d.getDate() + 1)) heat.push({ n: perDay.get(dayKey(d.getTime())) || 0, label: d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) });
  const heatMax = Math.max(1, ...heat.map((h) => h.n));
  const heatHTML = `<div class="heat" role="img" aria-label="Activité des 17 dernières semaines">${heat.map((h) => `<i class="l${h.n ? Math.ceil((4 * h.n) / heatMax) : 0}" title="${esc(h.label)} : ${h.n}"></i>`).join('')}</div>`;
  const difficult = cards.filter((c) => (c.lapses || 0) >= 2 || (c.lastReview && c.easeFactor <= 1.5))
    .sort((a, b) => (b.lapses || 0) - (a.lapses || 0) || a.easeFactor - b.easeFactor).slice(0, 10);

  setMain(`
    <div class="grid">
      <div class="panel"><div class="muted small">Cartes</div><div class="stat-num">${cards.length}</div></div>
      <div class="panel"><div class="muted small">À réviser</div><div class="stat-num">${due}</div></div>
      <div class="panel"><div class="muted small">Nouvelles</div><div class="stat-num">${fresh}</div></div>
      <div class="panel"><div class="muted small">Maîtrisées (≥ 21 j)</div><div class="stat-num">${mastered}</div></div>
      <div class="panel"><div class="muted small">Aujourd’hui</div><div class="stat-num">${today.length}/${settings.dailyGoal}</div></div>
      <div class="panel"><div class="muted small">Réussite 7 jours</div><div class="stat-num">${rate}</div></div>
    </div>
    <div class="panel"><div class="muted small">Série actuelle : <strong>${plural(streakOf(reviews), 'jour', 'jours')}</strong>${suspended ? `, ${plural(suspended, 'carte suspendue', 'cartes suspendues')}` : ''}</div></div>
    <div class="panel"><div class="muted small">Activité, 17 dernières semaines</div>${heatHTML}</div>
    <div class="panel"><div class="muted small">Réponses — 14 derniers jours</div>${chart(days)}</div>
    <div class="panel"><div class="muted small">Révisions prévues — 7 prochains jours</div>${chart(forecast)}</div>
    <div class="section-title">Cartes difficiles</div>
    ${difficult.length ? `<div class="list">${difficult.map((c) => cardRow(c, lib, true)).join('')}</div>` : '<div class="panel empty">Aucune carte difficile pour l’instant.</div>'}`, {
    card: openCard(lib),
  });
}

/* ============================================================
   5. Backup / Restore Logic
   ============================================================ */
function stamp() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/* Shares (iOS sheet) or downloads a file. Resolves false if the user cancelled the share sheet. */
async function saveFile(name, text, type) {
  const blob = new Blob([text], { type });
  try {
    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
  } catch (e) {
    if (e && e.name === 'AbortError') return false;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
function pickTextFile(accept) {
  return new Promise((resolve) => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = accept;
    input.onchange = () => {
      const file = input.files && input.files[0];
      if (!file) { resolve(null); return; }
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result));
      reader.onerror = () => { toast('Lecture du fichier impossible'); resolve(null); };
      reader.readAsText(file);
    };
    input.click();
  });
}

/* Adds every item of `items` to `store` (ids stripped), then calls done(oldId -> newId map). */
function addAll(t, store, items, prepare, done) {
  const map = new Map();
  let left = items.length;
  if (!left) { done(map); return; }
  const finish = () => { if (--left === 0) done(map); };
  for (const item of items) {
    const obj = prepare({ ...item });
    if (!obj) { finish(); continue; }
    const oldId = obj.id;
    delete obj.id;
    onReq(t.objectStore(store).add(obj), (newId) => { map.set(oldId, newId); finish(); });
  }
}

/* Merges a backup object into the database in one atomic transaction (ids are re-mapped).
   replace = true wipes the current data (and settings, if the file has some) in that same transaction. */
async function importBackupData(data, replace = false) {
  const now = Date.now();
  // Legacy format: a plain array of flashcards without subjects/themes.
  if (Array.isArray(data)) {
    data = { subjects: [{ id: 1, name: 'Importé' }], themes: [{ id: 1, subjectId: 1, name: 'Général' }], cards: data.map((c) => ({ ...c, themeId: 1 })), reviews: [] };
  }
  const subjects = Array.isArray(data.subjects) ? data.subjects : [];
  const themes = Array.isArray(data.themes) ? data.themes : [];
  const reviews = Array.isArray(data.reviews) ? data.reviews : [];
  let added = 0;
  const settings = replace && Array.isArray(data.settings) ? data.settings.filter((x) => x && x.key in DEFAULT_SETTINGS && x.key !== 'lastBackup' && typeof x.value === typeof DEFAULT_SETTINGS[x.key]) : [];
  await tx(['subjects', 'themes', 'cards', 'reviews', 'settings'], 'readwrite', (t) => {
    if (replace) {
      ['subjects', 'themes', 'cards', 'reviews'].forEach((st) => onReq(t.objectStore(st).clear()));
      settings.forEach((x) => onReq(t.objectStore('settings').put({ key: x.key, value: x.value })));
    }
    addAll(t, 'subjects', subjects, (s) => (s.name ? { ...s, createdAt: s.createdAt || now, updatedAt: now } : null), (subjMap) => {
      addAll(t, 'themes', themes, (th) => (subjMap.has(th.subjectId) && th.name ? { ...th, direction: DIRECTIONS.some((d) => d.value === th.direction) ? th.direction : 'front', subjectId: subjMap.get(th.subjectId), createdAt: th.createdAt || now, updatedAt: now } : null), (themeMap) => {
        addAll(t, 'cards', data.cards, (c) => {
          if (!themeMap.has(c.themeId) || !c.front || !c.back) return null;
          added++;
          return {
            ...newCard(themeMap.get(c.themeId), String(c.front), String(c.back), c.notes ? String(c.notes) : ''),
            id: c.id,
            interval: Number(c.interval) || 0,
            repetitions: Number(c.repetitions) || 0,
            easeFactor: Math.max(1.3, Number(c.easeFactor) || 2.5),
            dueDate: Number(c.dueDate) || now,
            createdAt: Number(c.createdAt) || now,
            lastReview: c.lastReview ? Number(c.lastReview) : (Number(c.repetitions) > 0 ? now : null),
            lapses: Number(c.lapses) || 0,
            suspended: !!c.suspended,
            weight: Number(c.weight) > 0 ? Math.min(10, Math.max(0.1, Number(c.weight))) : undefined,
            image: isImage(c.image) ? c.image : '',
          };
        }, (cardMap) => {
          addAll(t, 'reviews', reviews, (r) => (cardMap.has(r.cardId) ? { ...r, cardId: cardMap.get(r.cardId) } : null), () => {});
        });
      });
    });
  });
  return added;
}

/* ---------- CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const sep = [',', ';', '\t'].map((s) => [s, firstLine.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQuotes = false; }
      else field += ch;
    } else if (ch === '"' && field === '') inQuotes = true;
    else if (ch === sep) { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => c.trim() !== ''));
}
const CSV_ALIASES = {
  subject: ['subject', 'sujet', 'matiere', 'deck'],
  theme: ['theme', 'chapitre', 'chapter', 'topic'],
  front: ['front', 'recto', 'question', 'avant'],
  back: ['back', 'verso', 'reponse', 'answer', 'arriere'],
  notes: ['notes', 'note', 'extra'],
};
const CSV_EXTRA = ['kana', 'romaji', 'kanji', 'translation', 'example'];

function csvToRecords(rows) {
  const header = rows[0].map(norm);
  const col = {};
  for (const [key, names] of Object.entries(CSV_ALIASES)) col[key] = header.findIndex((h) => names.includes(h));
  const extraCols = CSV_EXTRA.map((n) => header.indexOf(n)).filter((i) => i >= 0);
  let body = rows.slice(1);
  if (col.front < 0 || col.back < 0) { // no recognizable header: front, back, notes
    body = rows; col.subject = -1; col.theme = -1; col.front = 0; col.back = 1; col.notes = 2;
  }
  const get = (r, i) => (i >= 0 && i < r.length ? r[i].trim() : '');
  return body.map((r) => {
    const extras = extraCols.map((i) => get(r, i)).filter((v) => v && v !== get(r, col.front) && v !== get(r, col.back));
    return {
      subject: get(r, col.subject) || 'Importé',
      theme: get(r, col.theme) || 'Général',
      front: get(r, col.front),
      back: get(r, col.back),
      notes: [get(r, col.notes), ...extras].filter(Boolean).join(' · '),
    };
  }).filter((r) => r.front && r.back);
}

async function importCSVFile() {
  const text = await pickTextFile('.csv,text/csv,text/plain');
  if (text == null) return;
  const rows = parseCSV(text);
  if (!rows.length) { toast('Fichier CSV vide'); return; }
  const records = csvToRecords(rows);
  if (!records.length) { toast('Aucune carte valide (recto + verso requis)'); return; }
  if (!confirm(`Importer ${plural(records.length, 'carte', 'cartes')} ?`)) return;
  const skipped = await importRecords(records);
  toast(plural(records.length - skipped, 'carte importée', 'cartes importées') + (skipped ? `, ${plural(skipped, 'doublon ignoré', 'doublons ignorés')}` : ''));
  render();
}

/* Inserts CSV records, creating subjects/themes by name when missing, in one transaction.
   Cards whose recto + verso already exist (in the base or earlier in the file) are skipped; returns how many. */
async function importRecords(records) {
  const lib = await loadLibrary();
  const seen = new Set(lib.cards.map((c) => norm(c.front) + '|' + norm(c.back)));
  const total = records.length;
  records = records.filter((r) => { const k = norm(r.front) + '|' + norm(r.back); if (seen.has(k)) return false; seen.add(k); return true; });
  const subjects = new Map(lib.subjects.map((s) => [norm(s.name), s.id]));
  const themes = new Map(lib.themes.map((t) => [t.subjectId + '|' + norm(t.name), t.id]));
  const now = Date.now();
  await tx(['subjects', 'themes', 'cards'], 'readwrite', (t) => {
    const ensureSubject = (name, cb) => {
      const key = norm(name);
      if (subjects.has(key)) { cb(subjects.get(key)); return; }
      onReq(t.objectStore('subjects').add({ name, createdAt: now, updatedAt: now }), (id) => { subjects.set(key, id); cb(id); });
    };
    const ensureTheme = (subjectId, name, cb) => {
      const key = subjectId + '|' + norm(name);
      if (themes.has(key)) { cb(themes.get(key)); return; }
      onReq(t.objectStore('themes').add({ subjectId, name, createdAt: now, updatedAt: now }), (id) => { themes.set(key, id); cb(id); });
    };
    const step = (i) => {
      if (i >= records.length) return;
      const r = records[i];
      ensureSubject(r.subject, (sid) => ensureTheme(sid, r.theme, (tid) => {
        onReq(t.objectStore('cards').add({ ...newCard(tid, r.front, r.back, r.notes), createdAt: now + i }), () => step(i + 1));
      }));
    };
    step(0);
  });
  return total - records.length;
}

async function exportCSV() {
  const lib = await loadLibrary();
  const q = (v) => (/[",;\n\r]/.test(v) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v));
  const lines = ['subject,theme,front,back,notes'];
  for (const c of lib.cards) {
    const t = lib.themeById.get(c.themeId);
    const s = t ? lib.subjectById.get(t.subjectId) : null;
    lines.push([s ? s.name : '', t ? t.name : '', c.front, c.back, c.notes || ''].map(q).join(','));
  }
  await saveFile(`anki_cartes_${stamp()}.csv`, '﻿' + lines.join('\n'), 'text/csv');
}

  const b = e.target.closest('[data-tab]');
  if (!b) return;
  if (b.dataset.tab === state.tab && b.dataset.tab === 'library') state.lib = { subjectId: null, themeId: null, search: '' };

});

/* iOS home-screen apps with a translucent status bar get a viewport shorter than the screen by about the
   status bar height, leaving a strip at the bottom. Stretch the app to the real screen height in that case.
   shortcut: portrait only (iOS reports screen size in portrait); landscape keeps the normal layout. */
function fitScreen() {
  const app = $('#app');
  const short = navigator.standalone && matchMedia('(orientation: portrait)').matches && screen.height > innerHeight;
  app.style.bottom = short ? 'auto' : '';
  app.style.height = short ? screen.height + 'px' : '';
}

(async function boot() {
  try {
    await openDB();
    await getSettings(); // loads DAY_START before the first render
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  } catch (e) {
    $('#main').innerHTML = `<div class="panel empty">Impossible d’ouvrir la base locale : ${esc(e.message)}</div>`;
    return;
  }
  fitScreen();
  addEventListener('resize', fitScreen);
  render();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !state.review && !state.quiz) render(); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    // Cache-first serves the old page once after an update; reload as soon as the new worker takes over
    // (not on first install, and never in the middle of a review or quiz).
    const hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (hadController && !state.review && !state.quiz) location.reload();
    });
    navigator.serviceWorker.register('./sw.js').catch((e) => console.warn('SW registration failed', e));
  }
})();
</script>
